    <button onclick="singleClick()">
      click
    </button>

    <button ondblclick="doubleClick()">
      double click
    </button>

    <button onmouseenter="cursorEnter()">
      enter
    </button>

    <button onmouseleave="cursorExit()">
      exit
    </button>

    <button onmousemove="cursorMove()">
      move
    </button>

    <input type="text" onkeydown="keyPress()">

    <input type="text" onkeyup="keyRelease()">

    <input type="text" onchange="focusChange()">


    <fieldset>
      <legend>Fill this form</legend>
      <form onsubmit="formHandle(event)">
        <input type="text">
        <br>
        <input type="text">
        <br>
        <button>
          Submit
        </button>
      </form>
    </fieldset>
